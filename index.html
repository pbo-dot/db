<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>DB</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; font: 13px system-ui, sans-serif; color: #4b5563; }
      #dot { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #374151; transition: background .2s; }
      body.on #dot { background: #1d4ed8; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
      #clock { position: fixed; top: 38%; left: 0; right: 0; text-align: center; color: #6b7280; }
      #time { font-weight: 200; font-size: min(24vw, 120px); letter-spacing: .02em; font-variant-numeric: tabular-nums; line-height: 1; }
      #date { margin-top: 10px; font-size: 16px; }
      #msg { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); left: 0; right: 0; text-align: center; padding: 0 24px; }
    </style>
  </head>
  <body>
    <div id="dot" role="img" aria-label="Optager ikke"></div>
    <div id="clock"><div id="time"></div><div id="date"></div></div>
    <div id="msg" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
