<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>DB</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      body { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; font: 13px system-ui, sans-serif; color: #9ca3af; }
      #dot { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #d1d5db; transition: background .2s; }
      body.on #dot { background: #2563eb; animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .35); } 50% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); } }
      #msg { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); left: 0; right: 0; text-align: center; padding: 0 24px; }
    </style>
  </head>
  <body>
    <div id="dot" role="img" aria-label="Optager ikke"></div>
    <div id="msg" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
